Refresh gallery after upload.app


4. Backend Media Improvements

Current prototype downloads the entire Telegram file into memory.

Change eventually to:

Telegram
   ↓
Django
   ↓
stream/cache
   ↓
React Native

Implement:

Proper streaming for large files.
Avoid loading entire videos/images into RAM.
HTTP caching where appropriate.
Correct MIME types.
Content-Disposition.
Thumbnail endpoint.
Video thumbnail generation if Telegram doesnt provide a usable thumbnail.
Handle missing/deleted Telegram files.

