Recommended implementation order

Tell the coding agent to follow this order:

1. Finish Media Viewer
2. Video playback
3. Upload UI
4. Albums UI
5. Favorites
6. Trash UI + permanent delete
7. Search + filters
8. Date grouping
9. Selection mode
10. Share + Download
11. Settings
12. Backend streaming
13. Background uploads (Celery + Redis)
14. Caching
15. Security hardening
16. Testing
17. Production deployment
18. Release APK/AAB

Don't implement offline sync, complicated caching, Celery, or advanced optimization too early. Get the complete basic gallery experience working first, then production-hardening.