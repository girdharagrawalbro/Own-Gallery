15. Telegram Storage Layer

Keep Telegram-specific logic isolated:

telegram_storage/
    service.py

The rest of Django shouldn't directly deal with Telegram APIs.

Ideally:

Media API
   ↓
TelegramStorageService
   ↓
Telegram

This makes it possible to replace Telegram later with S3/Storj/etc.

16. Background Upload Processing

For production, don't make Django request wait for huge uploads.

Eventually:

React Native
      ↓
Django
      ↓
Create upload job
      ↓
Redis
      ↓
Celery worker
      ↓
Telegram
      ↓
PostgreSQL

Frontend can poll:

upload status

or use WebSocket later.

17. Caching

Add caching at multiple levels:

React Native
   ↓
Image cache
   ↓
Django cache
   ↓
Telegram

Especially important because Telegram is being used as the actual storage layer.

