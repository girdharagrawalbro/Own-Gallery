3. Upload

Flow:

Gallery
   ↓
+ button
   ↓
Select Image / Video
   ↓
Preview selected files
   ↓
Upload
   ↓
React Native → Django
   ↓
Django → Telegram private channel
   ↓
Telegram message/file IDs
   ↓
Django → PostgreSQL metadata
   ↓
Return Media object
   ↓
